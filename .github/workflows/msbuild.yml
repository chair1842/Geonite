name: Build Geonite

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "0 16 * * *"  # Every midnight UTC+8
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: Geonite.sln
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Install SDL2
      run: vcpkg install sdl2:x64-windows

    - name: Restore dependencies
      run: msbuild -t:Restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build solution
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform="x64" /p:VcpkgTriplet=x64-windows ${{env.SOLUTION_FILE_PATH}}
